services:
  neo4j:
    image: neo4j:5.18
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/password
    volumes: [neo4j_data:/data]

  api:
    build: .
    ports: ["8000:8000"]
    depends_on: [neo4j]
    env_file: config/.env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    volumes: ["./data:/app/data"]

volumes:
  neo4j_data:
